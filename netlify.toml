[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

# Port 8899 is deliberate: another local project (SimpleSchool) uses 5173,
# so JOA gets its own port to avoid the two dev servers colliding.
[dev]
  # Naming the framework matters: without it netlify dev applies the SPA
  # fallback below to Vite's module requests (/src/*.js → index.html) and the
  # app loads blank. --offline in package.json skips the Netlify account lookup.
  framework  = "vite"
  command    = "vite"
  targetPort = 3001
  port       = 8899

[build.environment]
  NODE_VERSION = "18"

# @libsql/client ships native bindings that must not be bundled by esbuild.
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@libsql/client"]

# Clean URLs: /api/create-booking → /.netlify/functions/create-booking
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# SPA fallback: client-side routes (/book, /account, …) must serve the app
# on hard refresh / direct links. Must come AFTER the /api rule.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
