[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[dev]
  command    = "vite"
  targetPort = 5173
  port       = 8888

[build.environment]
  NODE_VERSION = "18"

# Clean URLs: /api/submit-booking → /.netlify/functions/submit-booking
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200
